<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPLC Challenges</title>
  <meta name="description" content="Write Untyped Plutus Core that passes the tests, then see how its CPU, memory and size compare to a reference solution." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="UPLC Challenges" />
  <meta property="og:description" content="Write Untyped Plutus Core that passes the tests, then see how its CPU, memory and size compare to a reference solution." />
  <meta property="og:url" content="https://samdelaney.github.io/uplc-bug-hunt/practice.html" />
  <meta property="og:image" content="https://samdelaney.github.io/uplc-bug-hunt/social-preview.png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="640" />
  <meta property="og:image:alt" content="UPLC Bug Hunt: a UPLC snippet with a bug underlined, and the question What's the problem?" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="practice">
  <main>
    <header class="top">
      <h1>
        <a class="home" href="index.html" aria-label="Home" title="Home">←</a>
        <a href="index.html">UPLC <span>Bug Hunt</span></a> <small>challenges</small>
      </h1>
      <span class="muted" id="engine">Loading</span>
    </header>

    <div class="layout">
      <nav class="card problems" aria-label="Problems">
        <div id="problemList"></div>
      </nav>

      <section class="work">
        <div class="card">
          <div class="meta">
            <span class="badge" id="diff"></span>
            <h2 id="title"></h2>
          </div>
          <p id="statement"></p>
          <p class="muted" id="refLine"></p>
        </div>

        <div class="editor-wrap">
          <textarea id="editor" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
        <div class="actions">
          <button class="primary" id="run">Run <span class="kbd">Ctrl+Enter</span></button>
          <button id="reset">Reset</button>
          <span class="muted" id="status"></span>
          <a class="report" id="report" href="https://github.com/samdelaney/uplc-bug-hunt/issues/new" target="_blank" rel="noopener">Report an issue</a>
        </div>

        <div class="card" id="summary" hidden></div>
        <div class="card results" id="results" hidden></div>
        <div class="card" id="reference" hidden>
          <p class="label">Reference</p>
          <pre class="code" id="refCode"></pre>
        </div>
      </section>
    </div>
  </main>
  <script src="highlight.js"></script>
  <script src="report.js"></script>
  <script src="problems.js"></script>
  <script type="module" src="practice.js"></script>
</body>
</html>
