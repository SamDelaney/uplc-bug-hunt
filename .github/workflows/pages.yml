name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs every puzzle and practice problem through the committed wasm evaluator;
      # a wrong answer key or a broken build stops the deploy.
      - name: Verify puzzles and problems
        run: node scripts/verify.mjs

      # Only the files the pages need; README, sources and workflow stay out of the site.
      - name: Stage site
        run: |
          mkdir -p _site/pkg
          cp index.html practice.html style.css highlight.js game.js puzzles.js problems.js \
             practice.js evaluator.js evaluator-worker.js .nojekyll _site/
          cp pkg/uplc_eval.js pkg/uplc_eval_bg.wasm _site/pkg/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
