[package]
name = "uplc-eval"
version = "0.1.0"
edition = "2021"
# Matches uplc 1.1.21's own MSRV; also makes cargo's resolver avoid newer transitive deps.
rust-version = "1.86"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: the evaluator is the judge, so upgrading it is a deliberate change
# (re-run scripts/verify.js against the new version before bumping).
uplc = "=1.1.21"
wasm-bindgen = "=0.2.100"
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# Pulled in transitively by uplc's dependencies; the browser build needs its `js` backend.
# Evaluation itself never asks for randomness.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
